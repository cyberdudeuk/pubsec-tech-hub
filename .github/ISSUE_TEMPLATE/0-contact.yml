name: Contact the hub
description: Questions, feedback, access needs or anything else. This is the only way to get in touch; we never publish an email address.
title: "[Contact] "
labels: ["contact"]
body:
  - type: markdown
    attributes:
      value: |
        What you write here is **public**. Please don't include names of private individuals, contact details, personal data or anything with a protective marking. We reply on this issue, usually within 10 working days.
  - type: dropdown
    id: topic
    attributes:
      label: What is it about?
      options: [General question, Feedback on the site, Something else]
    validations: {required: true}
  - type: textarea
    id: message
    attributes:
      label: Your message
    validations: {required: true}
  - type: checkboxes
    id: public
    attributes:
      label: Before you send
      options:
        - label: I understand this is public and I haven't included personal or sensitive information.
          required: true
