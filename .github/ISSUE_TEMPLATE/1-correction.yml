name: Report a correction
description: Something on the hub is wrong, out of date or missing a source.
title: "[Correction] "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        What you write here is **public**. Please don't include names of private individuals, contact details, personal data or anything with a protective marking. We reply on this issue, usually within 10 working days.
  - type: input
    id: where
    attributes:
      label: Which listing or section?
    validations: {required: true}
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong, and what should it say?
    validations: {required: true}
  - type: input
    id: source
    attributes:
      label: A public source for the correction (an https address)
  - type: checkboxes
    id: public
    attributes:
      label: Before you send
      options:
        - label: I understand this is public and I haven't included personal or sensitive information.
          required: true
